onboarding = false
[keys]
# Leader / prefix key changed from default "ctrl+b" to "ctrl+space"
prefix = "ctrl+space"

# Tab navigation: shift+left / shift+right to switch tabs
previous_tab = "shift+left"
next_tab = "shift+right"

# Workspace navigation: leader+up / leader+down to switch spaces
previous_workspace = "prefix+up"
next_workspace = "prefix+down"

# Split panes: leader+| for vertical split, leader+- for horizontal split
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

toggle_sidebar = "prefix+m"

[ui]
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
tab_bar_position = "bottom"          # default "top"
